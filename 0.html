<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coming soon · window view</title>
  <!-- Font & basic styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&amp;display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0d10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
    }

    /* main card – the "window" */
    .window-card {
      max-width: 880px;
      width: 100%;
      background: #14181c;
      border-radius: 2.5rem;
      padding: 2.5rem 2rem 2.8rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s ease;
      position: relative;
    }

    /* subtle window reflection */
    .window-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 0%, transparent 60%);
      pointer-events: none;
      border-radius: 2.5rem;
    }

    /* header: "see through the window" */
    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem 0.5rem;
      margin-bottom: 2.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding-bottom: 1.2rem;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .window-title h1 {
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: #eceef0;
      background: rgba(255,255,255,0.03);
      padding: 0.2rem 1rem 0.2rem 0.8rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(2px);
    }

    .window-title span {
      font-size: 1.4rem;
      color: #7f8b96;
      font-weight: 300;
      margin-left: 0.2rem;
    }

    .badge-soon {
      background: #2b323a;
      color: #bcc9d4;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(2px);
    }

    /* grid – the "design windows" (coming soon cards) */
    .design-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.8rem;
    }

    .design-card {
      background: #1e2329;
      border-radius: 1.8rem;
      padding: 1rem 0.6rem 1.2rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.03);
      box-shadow: 0 6px 12px -8px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      cursor: default;
    }

    .design-card:hover {
      background: #252d35;
      border-color: rgba(255,255,255,0.08);
      transform: translateY(-3px);
      box-shadow: 0 14px 20px -10px #050708;
    }

    /* "window" placeholder with number */
    .card-window {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0f1318;
      border-radius: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 300;
      color: #4d5a66;
      border: 1px solid rgba(255,255,255,0.02);
      transition: all 0.2s;
      background-image: radial-gradient(circle at 30% 40%, #1a222a 0%, #0b0f14 80%);
      position: relative;
      overflow: hidden;
    }

    .card-window::after {
      content: '⌇';
      font-size: 2.2rem;
      opacity: 0.2;
      color: #b0c2d0;
      position: absolute;
      bottom: 0.2rem;
      right: 0.5rem;
      transform: rotate(10deg);
    }

    .design-card:hover .card-window {
      border-color: rgba(255,255,255,0.1);
      box-shadow: inset 0 0 18px rgba(70, 130, 200, 0.08);
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 400;
      color: #8c9aa8;
      letter-spacing: 0.02em;
      background: rgba(255,255,255,0.02);
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.02);
      margin-top: 0.2rem;
      width: fit-content;
    }

    .card-label small {
      font-weight: 300;
      color: #63707e;
      margin-left: 0.2rem;
    }

    /* "click on a design" hint — coming soon version */
    .interaction-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.02);
    }

    .hint-pulse {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255,255,255,0.02);
      padding: 0.4rem 1.2rem 0.4rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.02);
      backdrop-filter: blur(2px);
    }

    .hint-pulse span {
      color: #b0c5d6;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .hint-pulse i {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #5f7f9e;
      border-radius: 50%;
      margin-right: 0.2rem;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); background: #9ab8d6; }
      100% { opacity: 0.2; transform: scale(0.8); }
    }

    .hint-extra {
      font-size: 0.7rem;
      color: #5b6b7a;
      background: #1b2127;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.02);
    }

    /* footer / small "ZA/PM" */
    .window-footer {
      margin-top: 2.2rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
      border-top: 1px solid rgba(255,255,255,0.02);
      padding-top: 1.2rem;
      color: #434f5a;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }

    .window-footer .signature {
      font-weight: 400;
      color: #6d7e8c;
      background: rgba(255,255,255,0.02);
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .footer-note {
      display: flex;
      gap: 0.8rem;
    }

    .footer-note span {
      color: #4b5a66;
    }

    /* responsive */
    @media (max-width: 500px) {
      .window-card {
        padding: 1.8rem 1rem 1.8rem;
        border-radius: 1.8rem;
      }
      .window-title h1 {
        font-size: 1.2rem;
        padding: 0.1rem 0.6rem;
      }
      .badge-soon {
        font-size: 0.6rem;
      }
      .design-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 1rem;
      }
      .card-window {
        font-size: 1.4rem;
      }
      .hint-pulse span {
        font-size: 0.8rem;
      }
    }

    /* extra: "coming soon" overlay on each card — but we keep minimal */
    .card-soon-tag {
      position: absolute;
      top: 0.3rem;
      right: 0.3rem;
      background: #1e2a33;
      color: #96aebb;
      font-size: 0.5rem;
      font-weight: 600;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.04);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      backdrop-filter: blur(2px);
      opacity: 0.7;
    }
  </style>
</head>

</body></html>
